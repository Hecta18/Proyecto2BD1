services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: proy3
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: tienda
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./db/roles.sql:/docker-entrypoint-initdb.d/02-roles.sql:ro
      - ./db/procedures.sql:/docker-entrypoint-initdb.d/03-procedures.sql:ro
      - ./db/seed.sql:/docker-entrypoint-initdb.d/04-seed.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U proy3 -d tienda']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql://proy3:secret@db:5432/tienda
      PORT: 3000
      HOST: 0.0.0.0
      SESSION_SECRET: ${SESSION_SECRET:-proyecto3-session-secret}
    ports:
      - '${PORT:-3000}:3000'
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure

volumes:
  postgres_data:
